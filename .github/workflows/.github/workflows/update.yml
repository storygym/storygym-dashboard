name: Update dashboard Story Gym

on:
  schedule:
    # Setiap 6 jam (waktu UTC). 00,06,12,18 UTC = 08.00, 14.00, 20.00, 02.00 WITA
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil data YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fetch_stats.py

      - name: Simpan riwayat ke repository
        run: |
          git config user.name "storygym-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data.json site/history.json
          git diff --cached --quiet || git commit -m "Update data $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
